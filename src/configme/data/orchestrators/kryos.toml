# kryos orchestrator: model-agnostic framework for ice sheets and glaciers on
# regional domains with optional global components; successor to yelmox. Every
# component backend (yelmo, FastIsostasy, chion, ...) is a library behind a
# same-interface stub, switched in kryos' config/common.mk (yelmo=1, cism=0, ...).
#
# This is the shipped seed manifest. A cloned kryos carrying its own
# .configme/manifest.toml takes precedence (see docs/DESIGN.md sec. 3).

[orchestrator]
name = "kryos"
org = "fesmc"
repo = "kryos"
dir = "kryos"
config_style = "makefile-template"

# The default set installed by `configme install kryos`, in build order: every
# backend with an adapter in kryos (the default-on ones of kryos' common.mk and
# the geo backend vilma2 and ice backend PlasticIceSheet, vilma=1 and plastic=1),
# so one install builds any switch combination. FastHydrology (with elsa,
# tracer) is cloned inside yelmo's checkout via yelmo's `nest` links. kryos'
# own `make kryos` builds the backend libraries (as yelmox does); configme
# builds the packages with a [package.build] (fesm-utils, insol, chion,
# PlasticIceSheet). cism, pism and rembo1 join when their adapters exist.
default_packages = [
    "insol",
    "fesm-utils",
    "yelmo",
    "FastIsostasy",
    "FastHydrology",
    "chion",
    "vilma2",
    "PlasticIceSheet",
]

# Module dependencies are generated from src/ into config/deps.mk at configure
# time (kryos' config/Makefile includes it); no hand-written per-object rules.
[orchestrator.fortran_deps]
src = ["src"]
